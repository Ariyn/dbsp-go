pipeline:
  wal:
    enabled: true
    path: /tmp/dbsp-wal.db
    checkpoint_every_batches: 1
  state_backend:
    enabled: true
    type: kv
    path: /tmp/dbsp-state.db
    checkpoint_mode: incremental
    checkpoint_every_batches: 100
    max_incremental_mutation_bytes: 1048576
  source:
    type: csv
    config:
      path: examples/data.csv
      schema:
        plant_id: string
        local_date: string
        panel_position: string
        v_out: float
        i_out: float
        timestamp: string
  transform:
    type: sql
    query: "SELECT panel_position, SUM(v_out*i_out) AS p FROM sales GROUP BY panel_position"
  sink:
    type: parquet
    config:
      path: /tmp/dbsp-out.parquet
      schema_cache_path: /tmp/dbsp-out.schema.json
      compression: zstd
  partition:
    enabled: true
    keys: [plant_id, local_date]
